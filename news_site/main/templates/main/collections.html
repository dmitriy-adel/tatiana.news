{% extends 'main/base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
<link rel="stylesheet" href="{% static 'main/css/collections.css' %}">

<div class="collections-page">

    <h1 class="page-title">Мои коллекции новостей</h1>

    <div id="collections-container">

    </div>

    <!-- правая панель с новостями -->
    <div id="collection-detail" class="collection-detail" style="display: none;">
        <div class="detail-header">
            <button onclick="closeDetailPanel()" class="back-btn">← Назад</button>
            <h2 id="detail-collection-name"></h2>
        </div>
        <div id="news-list" class="news-list"></div>
    </div>

</div>

<div id="edit-collection-modal" class="modal hidden">
    <span class="close-btn" onclick="closeEditModal()">×</span>
    
    <h2>Редактирование коллекции</h2>

    <label for="edit-collection-name">Наименование</label>
    <input type="text" id="edit-collection-name" placeholder="Введите название" autocomplete="off">

    <label for="edit-collection-description">Описание</label>
    <input type="text" id="edit-collection-description" placeholder="Введите описание" autocomplete="off">

    <div id="edit-collection-error" class="error-message"></div>

    <div class="modal-buttons">
        <button onclick="closeEditModal()" class="red-btn">Отмена</button>
        <button onclick="saveCollectionChanges()" class="blue-btn">Сохранить</button>
    </div>
</div>


<!-- Модальное окно создания коллекции -->
<div id="create-collection-modal" class="modal hidden">
    <span class="close-btn" id="create-modal-close">×</span>
    
    <h2>Укажите параметры новой коллекции новостей</h2>

    <label for="collection-name">Наименование <span style="color: #dc3545;">*</span></label>
    <input type="text" id="collection-name" placeholder="Введите название коллекции" autocomplete="off">

    <label for="collection-description">Описание</label>
    <input type="text" id="collection-description" placeholder="Краткое описание (необязательно)" autocomplete="off">

    <div id="create-collection-error" style="color: #dc3545; font-size: 14px; min-height: 18px;"></div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button id="create-collection-cancel" class="red-btn cancel-btn" style="flex: 1;">
            Отмена
        </button>
        <button id="create-collection-confirm" class="blue-btn confirm-btn" disabled style="flex: 1;">
            Создать коллекцию
        </button>
    </div>
</div>

{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'main/js/collections.js' %}"></script>
{% endblock %}
